<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascentia Placement Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- PWA Manifest & Web App Config -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Google Fonts (Outfit & Inter) -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple-dark: #1e1b4b;
            --purple-mid: #2e1065;
            --purple-deep: #3b0764;
            --purple-vibrant: #7e22ce;
            --lavender-bg: #f5f3ff;
            --lavender-card: #faf5ff;
            --lavender-border: #e9d5ff;
            --text-dark: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #130f30 0%, #1e1b4b 45%, #2e1065 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand {
            font-family: 'Outfit', sans-serif;
        }

        .navbar-custom {
            background: rgba(19, 15, 48, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(233, 213, 255, 0.15);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.3px;
            color: #ffffff !important;
        }

        .navbar-brand span.highlight {
            color: #d8b4fe;
        }

        .main-wrapper {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(233, 213, 255, 0.4);
            margin-top: 1.5rem;
            margin-bottom: 2.5rem;
            padding: 2rem;
        }

        .auth-card {
            max-width: 450px;
            margin: 3rem auto;
            border: 1px solid var(--lavender-border);
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(30, 27, 75, 0.12);
        }

        .card-custom {
            border: 1px solid var(--lavender-border);
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(30, 27, 75, 0.05);
            transition: all 0.2s ease;
        }

        .card-custom:hover {
            box-shadow: 0 8px 24px rgba(126, 34, 206, 0.12);
        }

        .card-header-lavender {
            background-color: var(--lavender-card);
            border-bottom: 1px solid var(--lavender-border);
            border-top-left-radius: 13px !important;
            border-top-right-radius: 13px !important;
        }

        .btn-purple {
            background: linear-gradient(135deg, #7e22ce 0%, #581c87 100%);
            color: white;
            border: none;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.25);
        }
        .btn-purple:hover {
            background: linear-gradient(135deg, #6b21a8 0%, #3b0764 100%);
            color: white;
        }

        .badge-lavender {
            background-color: var(--lavender-bg);
            color: var(--purple-vibrant);
            font-weight: 600;
            border: 1px solid var(--lavender-border);
        }

        .metric-box {
            background: var(--lavender-card);
            border: 1px solid var(--lavender-border);
            border-radius: 14px;
            padding: 1.25rem;
        }

        .nav-tabs-purple {
            border-bottom: 2px solid var(--lavender-border);
        }
        .nav-tabs-purple .nav-link {
            color: #64748b;
            font-weight: 600;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 0.75rem 1.25rem;
        }
        .nav-tabs-purple .nav-link.active {
            color: var(--purple-vibrant);
            border-bottom: 3px solid var(--purple-vibrant);
            background: transparent;
        }

        .footer {
            margin-top: auto;
            background: rgba(19, 15, 48, 0.95);
            border-top: 1px solid rgba(233, 213, 255, 0.15);
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Navigation Header -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 sticky-top">
            <div class="container">
                <router-link :to="dashboardRoute" class="navbar-brand d-flex align-items-center gap-2">
                    <span>Ascentia <span class="highlight">Placement Portal</span></span>
                </router-link>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-3">
                        <li class="nav-item">
                            <router-link to="/" class="nav-link text-light px-2" active-class="active fw-bold">Public Stats</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/ats-screener" class="nav-link text-light px-2" active-class="active fw-bold">ATS Screener</router-link>
                        </li>
                        <template v-if="!isAuthenticated">
                            <li class="nav-item">
                                <router-link to="/login" class="nav-link text-light px-3" active-class="active fw-bold">Login</router-link>
                            </li>
                            <li class="nav-item">
                                <router-link to="/register" class="btn btn-purple btn-sm px-4 rounded-pill">Register</router-link>
                            </li>
                        </template>
                        <template v-else>
                            <li class="nav-item">
                                <router-link :to="dashboardRoute" class="btn btn-purple btn-sm px-3 rounded-pill">
                                    <i class="bi bi-speedometer2 me-1"></i> My Dashboard
                                </router-link>
                            </li>
                            <li class="nav-item">
                                <span class="badge badge-lavender text-uppercase px-3 py-2 rounded-pill">[[ userRole ]]</span>
                            </li>
                            <li class="nav-item">
                                <span class="nav-link disabled text-light fw-medium">
                                    <i class="bi bi-person-circle me-1 text-purple-light"></i> [[ userEmail ]]
                                </span>
                            </li>
                            <li class="nav-item">
                                <button @click="logout" class="btn btn-outline-light btn-sm px-3 rounded-pill">Logout</button>
                            </li>
                        </template>
                    </ul>
                </div>

            </div>
        </nav>

        <!-- Main Content Wrapper -->
        <main class="container">
            <div class="main-wrapper">
                <router-view></router-view>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer py-3 text-center fs-7">
            <div class="container">
                <small>&copy; Ascentia Placement Portal</small>
            </div>
        </footer>
    </div>

    <!-- Vue 3 & Vue Router 4 CDN Scripts -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <!-- Chart.js Library CDN for Visual Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Application Vue Script -->
    <script src="/static/js/app.js"></script>
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js')
            .then(() => console.log('PWA Service Worker Registered'))
            .catch(err => console.log('PWA Service Worker Registration Failed:', err));
        });
      }
    </script>
</body>
</html>
